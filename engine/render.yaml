# Render "Blueprint" — connect this repo in the Render dashboard and it will
# auto-detect this file (root: engine/) or you can point a Web Service at
# this directory manually and skip the blueprint. See root README for steps.
services:
  - type: web
    name: quant-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"  # replace with your deployed Vercel URL(s), comma-separated
      # Optional — enables AI-written narrative sections in generated reports.
      # Without these, reports still generate fully (deterministic templated
      # narrative instead of AI prose) — see app/reports/ai_client.py.
      # - key: REPORT_AI_API_KEY
      #   value: "sk-..."
      # - key: REPORT_AI_BASE_URL
      #   value: "https://bazaarlink.ai/api/v1"   # omit to call api.anthropic.com directly
      # - key: REPORT_AI_MODEL
      #   value: "claude-opus-5"
    healthCheckPath: /api/health
